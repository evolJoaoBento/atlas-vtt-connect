<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' https: wss: http: ws: blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Board page test</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="boardPage.css">
</head>
<body>
  <section id="table" class="table" aria-label="Scene">
    <canvas id="map" role="img" aria-label="Map"></canvas>
    <video id="ar-video" class="ar-video" playsinline muted autoplay hidden></video>
    <div id="board-3d" class="board-3d" hidden></div>
    <div id="view-buttons" class="view-buttons" hidden>
      <button id="follow-gm" type="button">Follow GM</button>
      <button id="fit-map" class="secondary" type="button">Fit map</button>
    </div>
    <nav class="toolbar" aria-label="Tools">
      <div id="board-buttons" class="board-buttons toolbar-group">
        <button id="dimension-button" class="tool-button" type="button" hidden></button>
        <button id="eye-button" class="tool-button" type="button" aria-haspopup="menu" aria-pressed="false" hidden></button>
        <div id="eye-menu" class="eye-menu toolbar-menu" role="menu" aria-label="See through" hidden></div>
        <button id="ar-button" class="tool-button" type="button" aria-haspopup="menu" aria-pressed="false" hidden></button>
        <div id="ar-panel" class="ar-panel toolbar-menu" role="menu" aria-label="AR settings" hidden></div>
      </div>
    </nav>
    <p id="turn-notice" class="turn-notice" role="status" hidden></p>
    <div id="hover-card" class="hover-card" hidden></div>
    <div id="initiative-panel" class="initiative-panel" hidden></div>
    <div id="statblock-preview" class="statblock-preview" hidden></div>
    <section id="handout" class="handout" hidden>
      <h2 id="handout-title"></h2><p id="handout-status"></p><canvas id="handout-canvas"></canvas>
      <button id="handout-close" type="button">Close</button><button id="handout-button" type="button" hidden>Image</button>
    </section>
    <section id="note-panel" hidden><h2 id="note-title"></h2><div id="note-body"></div><button id="note-close" type="button">Close</button></section>
  </section>
  <script type="module" src="boardPage.js"></script>
</body>
</html>
