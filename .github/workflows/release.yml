name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']
permissions:
  contents: write
  # Build provenance for the release assets, which Obsidian's community directory checks.
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run check:vendor
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      # A beta (a tag with a hyphen, for BRAT) is described by manifest-beta.json, so manifest.json on the default
      # branch keeps the stable version the community directory reads. Either way the released manifest.json says the tag.
      - name: Manifest version matches the tag
        run: |
          case "$TAG" in *-*) file=manifest-beta.json;; *) file=manifest.json;; esac
          test "$(node -p "require('./$file').version")" = "$TAG"
          mkdir -p dist-release && cp "$file" dist-release/manifest.json
      - name: versions.json lists the version
        run: node -e "const m=require('./dist-release/manifest.json');if(require('./versions.json')[m.version]!==m.minAppVersion)process.exit(1)"
      - run: NODE_ENV=production npm run build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/main.js
            dist/styles.css
            dist-release/manifest.json
      - name: Publish
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease";; esac
          gh release create "$TAG" dist/main.js dist/styles.css dist-release/manifest.json --title "$TAG" --notes "Release notes to follow: the maintainer replaces this line with what changed." $flags
